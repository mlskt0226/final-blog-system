cat > templates/base.html << 'EOF'
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root {
            --bg-primary: #f5f5f5; --bg-secondary: #ffffff; --text-primary: #1a1a1a;
            --text-secondary: #666; --card-bg: #ffffff; --border: #e0e0e0;
            --accent: #0070f3; --danger: #d32f2f; --shadow: 0 1px 3px rgba(0,0,0,0.06);
        }
        [data-theme="dark"] {
            --bg-primary: #1a1a1a; --bg-secondary: #2a2a2a; --text-primary: #ffffff;
            --text-secondary: #ccc; --card-bg: #2a2a2a; --border: #404040;
            --shadow: 0 1px 3px rgba(0,0,0,0.3); --accent: #4dabf7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; 
            min-height: 100vh; padding: 20px; transition: all 0.3s ease;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { 
            background: var(--bg-secondary); padding: 20px; border-radius: 12px; 
            box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; 
            margin-bottom: 30px;
        }
        nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        nav a { 
            color: var(--accent); text-decoration: none; padding: 6px 12px; 
            border-radius: 6px; transition: all 0.2s; border: 1px solid transparent;
        }
        nav a:hover { background: var(--border); }
        .theme-toggle {
            position: fixed; top: 20px; right: 20px; background: var(--accent); 
            color: white; border: none; padding: 12px; border-radius: 50%; 
            cursor: pointer; width: 50px; height: 50px; box-shadow: var(--shadow);
            transition: all 0.3s; z-index: 1000; font-size: 18px;
        }
        .theme-toggle:hover { transform: scale(1.1); box-shadow: 0 4px 12px rgba(0,112,243,0.4); }
        h1, h2 { color: var(--text-primary); margin-bottom: 20px; }
        .form-block { 
            background: var(--card-bg); padding: 24px; margin-bottom: 20px; 
            border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border);
        }
        input, textarea, button { 
            width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--border); 
            border-radius: 8px; font-size: 16px; box-sizing: border-box;
            background: var(--bg-primary); color: var(--text-primary);
        }
        button:not(.theme-toggle) { background: var(--accent); color: white; border: none; cursor: pointer; }
        button:not(.theme-toggle):hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); }
        @media (max-width: 768px) { 
            body { padding: 12px; } .theme-toggle { top: 10px; right: 10px; width: 45px; height: 45px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="Переключить тему">🌙</button>
    
    <div class="container">
        <header>
            <nav>
                <a href="/">🏠 Главная</a>
                <a href="/favorites">❤️ Избранное</a>
                <a href="/profile">👤 Профиль</a>
                <a href="/login">🔐 Вход</a>
                <a href="/register">📝 Регистрация</a>
                <a href="/logout">🚪 Выход</a>
            </nav>
            <h1>{{ title }}</h1>
        </header>
        {% block content %}{% endblock %}
    </div>

    <script>
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        // Загружаем сохранённую тему
        const savedTheme = localStorage.getItem('theme') || 'auto';
        if (savedTheme !== 'auto') {
            html.setAttribute('data-theme', savedTheme);
            toggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        }
        
        toggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            let nextTheme;
            
            if (current === 'dark' || current === null) {
                nextTheme = 'light';
                toggle.textContent = '🌙';
            } else {
                nextTheme = 'dark';
                toggle.textContent = '☀️';
            }
            
            html.setAttribute('data-theme', nextTheme);
            localStorage.setItem('theme', nextTheme);
        });
    </script>
</body>
</html>
EOF
